<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的爱好 - 我的主页</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 头部导航 -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">My<span>Homepage</span></div>
      <button class="nav-toggle" id="navToggle">&#9776;</button>
      <nav>
        <ul class="nav-menu" id="navMenu">
          <li><a href="index.html">我的首页</a></li>
          <li><a href="projects.html">项目展示</a></li>
          <li><a href="journal.html">我的日志</a></li>
          <li><a href="gallery.html">我的相册</a></li>
          <li><a href="hobby.html">我的爱好</a></li>
          <li><a href="contact.html">与我联系</a></li>
        </ul>
      </nav>
      <button class="theme-toggle" id="themeToggle" title="切换深浅色主题">🌙</button>
    </div>
  </header>

  <!-- 主体内容 -->
  <main class="container">
    <h1 class="page-title reveal">我的爱好</h1>
    <p class="page-subtitle reveal">工作学习之外的热爱，让生活更有趣</p>

    <div class="hobby-grid reveal">
      <div class="hobby-card">
        <img src="images/hobby-1.jpg" alt="摄影">
        <div class="body">
          <h3>摄影</h3>
          <p>喜欢用镜头记录生活中的光影瞬间，风景与街拍是我的主要题材。</p>
        </div>
      </div>
      <div class="hobby-card">
        <img src="images/hobby-2.jpg" alt="音乐">
        <div class="body">
          <h3>音乐</h3>
          <p>闲暇时听歌放松，也尝试过简单的编曲，享受旋律带来的平静。</p>
        </div>
      </div>
      <div class="hobby-card">
        <img src="images/hobby-3.jpg" alt="阅读">
        <div class="body">
          <h3>阅读</h3>
          <p>喜欢读设计与技术类的书籍，保持好奇心，不断拓宽自己的视野。</p>
        </div>
      </div>
    </div>

    <h2 class="section-title reveal">我的座右铭</h2>
    <div class="card">
      <p style="text-align:center; color:var(--primary); font-size:18px; font-weight:600;">
        "保持热爱，奔赴山海。"
      </p>
    </div>

  </main>

  <!-- 页脚 -->
  <footer class="site-footer">
    <p>&copy; 2026 孔德鹏的个人求职主页 | <a href="contact.html">与我联系</a></p>
  </footer>

  <!-- 回到顶部 -->
  <button id="backToTop" title="回到顶部">&#8593;</button>

  <script src="js/main.js"></script>
</body>
</html>
