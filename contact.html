<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>与我联系 - 我的主页</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 头部导航 -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">My<span>Homepage</span></div>
      <button class="nav-toggle" id="navToggle">&#9776;</button>
      <nav>
        <ul class="nav-menu" id="navMenu">
          <li><a href="index.html">我的首页</a></li>
          <li><a href="projects.html">项目展示</a></li>
          <li><a href="journal.html">我的日志</a></li>
          <li><a href="gallery.html">我的相册</a></li>
          <li><a href="hobby.html">我的爱好</a></li>
          <li><a href="contact.html">与我联系</a></li>
        </ul>
      </nav>
      <button class="theme-toggle" id="themeToggle" title="切换深浅色主题">🌙</button>
    </div>
  </header>

  <!-- 主体内容 -->
  <main class="container">
    <h1 class="page-title reveal">与我联系</h1>
    <p class="page-subtitle reveal">欢迎留言，我会尽快回复</p>

    <div class="contact-layout reveal">
      <!-- 联系方式 -->
      <div class="card">
        <h2 class="section-title reveal" style="margin-top:0;">联系方式</h2>
        <ul class="contact-info">
          <li><strong>姓名</strong>孔德鹏</li>
          <li><strong>电子邮箱</strong>kongdepeng@example.com</li>
          <li><strong>电话</strong>138-0000-0000</li>
          <li><strong>所在地区</strong>黑龙江省</li>
          <li><strong>求职方向</strong>Web 前端开发工程师</li>
        </ul>
      </div>

      <!-- 留言表单 -->
      <div class="card">
        <h2 class="section-title reveal" style="margin-top:0;">给我留言</h2>
        <form id="contactForm" novalidate>
          <div class="form-group">
            <label for="name">您的姓名</label>
            <input type="text" id="name" name="name" placeholder="请输入姓名">
            <span class="error-msg" id="nameErr"></span>
          </div>
          <div class="form-group">
            <label for="email">电子邮箱</label>
            <input type="email" id="email" name="email" placeholder="请输入邮箱">
            <span class="error-msg" id="emailErr"></span>
          </div>
          <div class="form-group">
            <label for="message">留言内容</label>
            <textarea id="message" name="message" placeholder="请输入留言内容（至少 5 个字）"></textarea>
            <span class="error-msg" id="messageErr"></span>
          </div>
          <button type="submit" class="btn">提交留言</button>
          <p class="form-tip" id="formTip"></p>
        </form>
      </div>
    </div>

  </main>

  <!-- 页脚 -->
  <footer class="site-footer">
    <p>&copy; 2026 孔德鹏的个人求职主页 | <a href="contact.html">与我联系</a></p>
  </footer>

  <!-- 回到顶部 -->
  <button id="backToTop" title="回到顶部">&#8593;</button>

  <script src="js/main.js"></script>
</body>
</html>
